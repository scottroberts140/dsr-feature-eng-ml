[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsr-feature-eng-ml"
version = "1.3.6"
description = "Machine learning-specific feature engineering utilities including models and evaluation tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Scott Roberts", email = "scottrdeveloper@gmail.com" }]
keywords = ["machine-learning", "feature-engineering", "ml", "models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "dsr-utils>=1.7.3",
    "dsr-data-tools>=2.1.0",
    "dsr-files>=3.1.1",
    "numpy>=2.4.4",
    "pandas>=2.2.0,<3.0.0",
    "scikit-learn>=1.8.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pytest-cov>=7.1.0"]
dev = ["dsr-feature-eng-ml[test]", "black>=26.3.1", "ruff>=0.15.9"]

[project.urls]
Documentation = "https://github.com/scottroberts140/dsr-feature-eng-ml/tree/main/docs/artifacts"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=src/dsr_feature_eng_ml --cov-report=html --cov-report=term-missing"

[tool.setuptools]
packages = ["dsr_feature_eng_ml"]

[tool.setuptools.package-dir]
"" = "src"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
